[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qatool"
version = "0.1.0"
description = "Codebase Q&A agent for indexing and querying repositories"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ksastry1988" }]
keywords = ["codebase", "qa", "repository", "search", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # 0.24+ loads ABI 15 grammars through Language(<module>.language()).
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "coverage[toml]>=7.0",
]

[project.scripts]
qatool = "qatool.cli:main"

[tool.setuptools]
packages = ["qatool"]
